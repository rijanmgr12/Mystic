<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Mystic Nepal</title>
    <link rel="icon" href="images/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="nav"></header>
    <section
      class="banner"
      style="background-image: url(&quot;images/banner-contact.jpg&quot;)"
    >
      <div>
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you!</p>
      </div>
    </section>
    <main class="wrap">
      <div class="cgrid">
        <div class="icard">
          <h3>Contact Information</h3>
          <div class="crow">
            <b>Address</b
            ><span
              >Mystic Nepal, Butwal-10, Rupandehi, Lumbini Province, Nepal</span
            >
          </div>
          <div class="crow"><b>Phone</b><span>+977-9800000000</span></div>
          <div class="crow"><b>Email</b><span>mysticnepal@gmail.com</span></div>
        </div>
        <div class="form-box" style="margin: 0; max-width: none">
          <h2>Send Us a Message</h2>
          <div id="msg" class="msg"></div>
          <form id="contactForm" novalidate>
            <div class="field">
              <label for="cname">Name</label
              ><input id="cname" type="text" placeholder="Enter your name" />
              <div class="err"></div>
            </div>
            <div class="field">
              <label for="cemail">Email</label
              ><input id="cemail" type="email" placeholder="Enter your email" />
              <div class="err"></div>
            </div>
            <div class="field">
              <label for="cmessage">Message</label
              ><textarea
                id="cmessage"
                rows="5"
                placeholder="Type your message"
              ></textarea>
              <div class="err"></div>
            </div>
            <button class="btn" type="submit" style="width: 100%">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
