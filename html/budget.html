<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Planner | Mystic Nepal</title>
    <link rel="icon" href="images/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="nav"></header>
    <section
      class="banner"
      style="background-image: url(&quot;images/banner-planner.jpg&quot;)"
    >
      <div>
        <h1>Plan Your Trip</h1>
        <p>Create your perfect journey to Nepal and see the estimated cost.</p>
      </div>
    </section>
    <main class="wrap">
      <div class="budget">
        <form
          id="budgetForm"
          class="form-box"
          style="margin: 0; max-width: none"
          novalidate
        >
          <div class="field">
            <label for="dest">Destination</label
            ><select id="dest"></select>
            <div class="err" id="errDest"></div>
          </div>
          <div class="field">
            <label for="days">Number of days</label
            ><input id="days" type="number" value="3" min="1" />
            <div class="err" id="errDays"></div>
          </div>
          <div class="field">
            <label for="people">Number of travellers</label
            ><input id="people" type="number" value="2" min="1" />
            <div class="err" id="errPeople"></div>
          </div>
          <div class="field">
            <label for="level">Travel style</label
            ><select id="level">
              <option value="budget">Budget</option>
              <option value="standard" selected>Standard</option>
              <option value="comfort">Comfort</option>
            </select>
          </div>
          <div class="field">
            <label for="transport"
              >Transport to destination, per person (NPR)</label
            ><input id="transport" type="number" value="2000" min="0" />
            <div class="err" id="errTrans"></div>
          </div>
          <button class="btn" type="submit" style="width: 100%">
            Calculate budget
          </button>
        </form>
        <div class="result" id="result">
          <h3>Your Trip Plan</h3>
          <p>
            Fill in the form and choose Calculate budget to see your plan here.
          </p>
        </div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/budget.js"></script>
  </body>
</html>
