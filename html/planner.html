<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mystic Nepal - Budget Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Mystic Nepal</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="planner.html" class="active">Trip Planner</a></li>
            <li><a href="favorites.html">Favorites (<span id="fav-badge">0</span>)</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li id="nav-auth"></li>
        </ul>
    </nav>

    <div class="container">
        <div style="background: white; padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color); max-width: 600px; margin: 0 auto;">
            <h2>Trip Budget Estimator</h2>
            <form id="planner-form" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Select Destination</label>
                    <select id="plan-destination" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Trip Duration (Days)</label>
                    <input type="number" id="plan-days" class="form-control" value="3" min="1" required>
                </div>
                <div class="form-group">
                    <label>Additional Daily Expenses (NPR)</label>
                    <input type="number" id="plan-daily" class="form-control" value="2000" min="0" required>
                </div>
                <div class="form-group">
                    <label>Estimated Transportation Cost (NPR)</label>
                    <input type="number" id="plan-transport" class="form-control" value="3000" min="0" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Calculate Budget</button>
            </form>

            <div id="planner-result" style="display:none; margin-top: 1.5rem; padding: 1rem; background: #dcfce7; border-radius: 6px; color: #15803d;"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mystic Nepal. All rights reserved.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/planner.js"></script>
</body>
</html>
