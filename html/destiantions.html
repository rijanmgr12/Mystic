<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mystic Nepal - Destinations</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Mystic Nepal</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html" class="active">Destinations</a></li>
            <li><a href="planner.html">Trip Planner</a></li>
            <li><a href="favorites.html">Favorites (<span id="fav-badge">0</span>)</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li id="nav-auth"></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Search & Filter Destinations</h2>
        
        <div class="filter-bar">
            <input type="text" id="search-input" class="form-control" placeholder="Search by destination name...">
            <select id="province-filter" class="form-control">
                <option value="">All Provinces</option>
                <option value="Koshi">Koshi</option>
                <option value="Madhesh">Madhesh</option>
                <option value="Bagmati">Bagmati</option>
                <option value="Gandaki">Gandaki</option>
                <option value="Lumbini">Lumbini</option>
                <option value="Karnali">Karnali</option>
                <option value="Sudurpashchim">Sudurpashchim</option>
            </select>
            <select id="category-filter" class="form-control">
                <option value="">All Categories</option>
                <option value="Hidden Gem">Hidden Gem</option>
                <option value="Famous">Famous</option>
                <option value="Cultural">Cultural</option>
                <option value="Trekking">Trekking</option>
            </select>
        </div>

        <div id="destinations-container" class="grid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Mystic Nepal. All rights reserved.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/destinations.js"></script>
</body>
</html>
