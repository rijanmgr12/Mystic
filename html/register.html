<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mystic Nepal - Register Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Mystic Nepal</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="planner.html">Trip Planner</a></li>
            <li><a href="favorites.html">Favorites (<span id="fav-badge">0</span>)</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li id="nav-auth"></li>
        </ul>
    </nav>

    <div class="container">
        <div style="background: white; padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color); max-width: 400px; margin: 2rem auto;">
            <h2>Create Account</h2>
            <form onsubmit="registerUser(event)" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" class="form-control" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">Already registered? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mystic Nepal. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
