<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Mystic Nepal</title>
    <link rel="icon" href="images/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="nav"></header>
    <main class="auth">
      <div>
        <h1>Your Next Adventure Awaits</h1>
        <p>
          Sign in to plan your trips, save destinations and explore Nepal like
          never before.
        </p>
      </div>
      <div class="form-box" style="margin: 0">
        <div class="tabs">
          <a class="" href="login.html">Login</a
          ><a class="on" href="register.html">Sign Up</a>
        </div>
        <div id="msg" class="msg"></div>
        <form id="registerForm" novalidate>
          <div class="field">
            <label for="name">Full name</label
            ><input id="name" type="text" autocomplete="name" />
            <div class="err"></div>
          </div>
          <div class="field">
            <label for="email">Email address</label
            ><input id="email" type="email" />
            <div class="err"></div>
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input id="password" type="password" autocomplete="new-password" />
            <div class="err"></div>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label
            ><input id="confirm" type="password" autocomplete="new-password" />
            <div class="err"></div>
          </div>
          <button class="btn" type="submit" style="width: 100%">
            Create account
          </button>
        </form>
        <p class="hint">
          Already registered? <a href="login.html"><b>Login</b></a>
        </p>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
